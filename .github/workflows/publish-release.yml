name: Generate boundary release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (for example 2026-08-24)
        required: true
        type: string
      countries:
        description: Comma-separated ISO3 countries; leave empty for global
        required: false
        default: IND
        type: string
      tolerance:
        description: Simplification tolerance in degrees
        required: false
        default: "0.001"
        type: string
      levels:
        description: Comma-separated boundary levels
        required: false
        default: ADM2
        type: string

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate release assets
        run: >-
          python generate.py
          --output .
          --version "${{ inputs.version }}"
          --countries "${{ inputs.countries }}"
          --tolerance "${{ inputs.tolerance }}"
          --levels "${{ inputs.levels }}"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists: $VERSION" >&2
            exit 1
          fi
          gh release create "$VERSION" --title "Boundary index $VERSION" --generate-notes
          find "dist/$VERSION" -type f -print0 | \
            xargs -0 gh release upload "$VERSION"
